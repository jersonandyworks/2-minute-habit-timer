<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:"
		/>
		<title>Time's Up!</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
		<style>
			body {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				padding: 26px;
				text-align: center;
			}

			.badge {
				width: 54px;
				height: 54px;
				border-radius: 18px;
				background: var(--white);
				color: var(--c4);
				display: grid;
				place-items: center;
				box-shadow: var(--shadow-card);
			}

			h1 {
				margin: 0;
				font-size: 20px;
				font-weight: 700;
			}

			.habit {
				margin: -8px 0 0;
				font-size: 13px;
				color: var(--ink-mid);
			}

			blockquote {
				margin: 0;
				background: var(--white);
				border-radius: var(--radius-card);
				box-shadow: var(--shadow-card);
				padding: 16px 18px;
				font-size: 14px;
				line-height: 1.5;
				color: var(--ink);
				max-width: 380px;
			}

			blockquote::before {
				content: open-quote;
				color: var(--c3);
			}

			blockquote::after {
				content: close-quote;
				color: var(--c3);
			}


			.note {
				margin: -6px 0 0;
				font: 600 12px/1 "Outfit", sans-serif;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--c4);
			}

			.note:empty {
				display: none;
			}

			.by {
				margin: -6px 0 0;
				font-size: 12px;
				color: var(--ink-dim);
			}

			.by:empty {
				display: none;
			}

			.notefield {
				width: 100%;
				max-width: 380px;
				display: flex;
				flex-direction: column;
				gap: 6px;
				text-align: left;
			}

			.notefield label {
				font: 600 11px/1 "Outfit", sans-serif;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--ink-dim);
			}

			.notefield textarea {
				width: 100%;
				height: 74px;
				resize: none;
				border: none;
				border-radius: var(--radius-field);
				box-shadow: inset 0 0 0 1.5px rgba(150, 230, 245, 0.9);
				padding: 11px 13px;
				font-family: inherit;
				font-size: 14px;
				line-height: 1.45;
				color: var(--ink);
				outline: none;
				user-select: text;
			}

			.notefield textarea:focus {
				box-shadow: inset 0 0 0 2px var(--c4);
			}

			.notefield textarea::placeholder {
				color: var(--ink-dim);
			}

			.btn {
				width: auto;
				min-width: 160px;
			}
		</style>
	</head>
	<body>
		<div class="badge" id="badge">
			<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
				<circle cx="12" cy="12" r="9" />
				<polyline points="12 7 12 12 15 14" />
			</svg>
		</div>

		<h1 id="title">Your session is done</h1>
		<p class="habit" id="habit"></p>
		<p class="note" id="note"></p>
		<blockquote id="quote">Loading…</blockquote>
		<p class="by" id="by"></p>

		<div class="notefield" id="notefield" hidden>
			<label for="notes">What did you get done?</label>
			<textarea id="notes" maxlength="500" placeholder="Two minutes of…"></textarea>
		</div>

		<button class="btn" id="close">Close</button>

		<script src="popup.js"></script>
	</body>
</html>
